name: Test Suite

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual trigger from GitHub UI

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: |
          BROWSERS=$(uv run python3 -c "import yaml; print(' '.join(yaml.safe_load(open('config.yaml'))['ui']['browsers']))")
          for b in $BROWSERS; do
            echo "==> Installing $b"
            uv run playwright install --with-deps $b
          done

      # Run all real tests across all browsers. Each step runs to completion
      # (if: always) so one failure doesn't skip the rest. Exit codes are
      # tracked and used for the final pass/fail verdict.

      - name: Run API tests
        id: api
        if: always()
        run: uv run pytest steps/api/ -v -m "not expected_failure"

      - name: Run UI tests (per browser)
        id: ui
        if: always()
        run: |
          BROWSERS=$(uv run python3 -c "import yaml; print(' '.join(yaml.safe_load(open('config.yaml'))['ui']['browsers']))")
          FAILED=0
          for b in $BROWSERS; do
            echo "==> Running UI tests on $b"
            uv run pytest steps/ui/ -v -m "not expected_failure" \
              --browser $b \
              --html=report-$b.html --self-contained-html \
              --junitxml=logs/results-$b.xml \
              -o "junit_suite_name=ui-$b" || FAILED=1
          done
          exit $FAILED

      # Expected-failure demos — these SHOULD fail, don't affect the build
      - name: Run expected-failure demos
        if: always()
        run: uv run pytest -v -m "expected_failure" || true

      # Generate a combined report (default browser, all suites)
      - name: Generate HTML report
        if: always()
        run: uv run pytest -v --html=report.html --self-contained-html || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            report.html
            report-*.html

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/

      # Final verdict — fail the workflow if any real test step failed
      - name: Check results
        if: always()
        run: |
          if [ "${{ steps.api.outcome }}" = "failure" ] || [ "${{ steps.ui.outcome }}" = "failure" ]; then
            echo "::error::Tests failed. Check the reports above."
            exit 1
          fi
